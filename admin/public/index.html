<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长安控车 · 网站后台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1e293b 0%, transparent 60%), #070b13;
    color: #e2e8f0;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 12px; color: #7d8aa3; }
  header .spacer { flex: 1; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(34,197,94,.12); color: #4ade80; border: 1px solid rgba(34,197,94,.25); }
  button, input, textarea, select { font: inherit; }
  button {
    cursor: pointer; border: 1px solid rgba(148,163,184,.22); background: rgba(148,163,184,.10);
    color: #e2e8f0; padding: 8px 14px; border-radius: 9px; font-size: 13px; transition: .15s;
  }
  button:hover { background: rgba(148,163,184,.2); }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
  button.primary:hover { background: #2563eb; }
  button.danger { color: #fca5a5; border-color: rgba(239,68,68,.3); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea, select {
    width: 100%; background: rgba(15,23,42,.7); border: 1px solid rgba(148,163,184,.22);
    color: #e2e8f0; padding: 10px 12px; border-radius: 9px; font-size: 13px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
  textarea { min-height: 120px; resize: vertical; line-height: 1.7; }
  label { display: block; font-size: 12px; color: #94a3b8; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .card { background: rgba(148,163,184,.06); border: 1px solid rgba(148,163,184,.14); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .hint { font-size: 12px; color: #7d8aa3; margin: 0 0 18px; line-height: 1.7; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 200px !important; min-width: 160px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .login { max-width: 380px; margin: 12vh auto 0; }
  .login h1 { text-align: center; font-size: 22px; }
  .login p { text-align: center; color: #7d8aa3; font-size: 13px; margin-bottom: 24px; }
  .msg { font-size: 12px; margin-top: 10px; min-height: 18px; }
  .msg.ok { color: #4ade80; } .msg.err { color: #fca5a5; }
  pre {
    background: #050810; border: 1px solid rgba(148,163,184,.14); border-radius: 10px;
    padding: 12px; font-size: 11px; line-height: 1.6; color: #94a3b8;
    max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid rgba(148,163,184,.1); }
  th { color: #94a3b8; font-weight: 600; }
  td .mini { padding: 4px 9px; font-size: 11px; margin-right: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .notice-item { border-left: 3px solid #3b82f6; padding: 4px 0 4px 12px; margin-bottom: 14px; }
  .notice-item .t { font-size: 13px; font-weight: 600; }
  .notice-item .d { font-size: 11px; color: #7d8aa3; }
  .notice-item .b { font-size: 12px; color: #cbd5e1; margin-top: 4px; white-space: pre-wrap; }
  .hidden { display: none !important; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const $ = (s, root) => (root || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = sessionStorage.getItem('carremote_admin_token') || '';
let TAB = 'notice';

async function api(url, opts) {
  const o = Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {});
  o.headers = Object.assign({}, o.headers, TOKEN ? { 'X-Admin-Token': TOKEN } : {});
  const r = await fetch(url, o);
  return await r.json();
}

function setMsg(id, text, ok) {
  const el = document.getElementById(id);
  if (el) { el.textContent = text || ''; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
}

/* ---------- 登录 ---------- */
function renderLogin() {
  $('#app').innerHTML = `
    <div class="login card">
      <h1>长安控车 · 网站后台</h1>
      <p>仅站主可登录。可发布公告、限制用户、管理白名单与卡密。</p>
      <div class="field"><label>后台密码</label><input id="pwd" type="password" placeholder="默认 admin888" autocomplete="current-password"></div>
      <button class="primary" style="width:100%" id="btnLogin">登 录</button>
      <div class="msg" id="loginMsg"></div>
    </div>`;
  const go = async () => {
    try {
      const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pwd').value }) });
      if (r.ok) { TOKEN = r.token; sessionStorage.setItem('carremote_admin_token', TOKEN); renderMain(); }
      else setMsg('loginMsg', r.message || '登录失败', false);
    } catch (e) { setMsg('loginMsg', '无法连接后台服务', false); }
  };
  $('#btnLogin').onclick = go;
  $('#pwd').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

/* ---------- 主界面 ---------- */
function renderMain() {
  $('#app').innerHTML = `
    <header>
      <h1>长安控车 · 网站后台</h1>
      <span class="badge" id="upstreamBadge">已连接</span>
      <span class="spacer"></span>
      <span class="sub">App 侧在「我的 → 网站后台」填写本服务地址</span>
      <button class="ghost" id="btnLogout">退出</button>
    </header>
    <div class="tabs">
      <button data-tab="notice" class="active">📢 公告发布</button>
      <button data-tab="users">👤 用户与限制</button>
      <button data-tab="cards">🎫 卡密</button>
      <button data-tab="about">ℹ️ 接入说明</button>
    </div>
    <div id="panel"></div>`;
  $('#btnLogout').onclick = async () => {
    await api('/api/logout', { method: 'POST', body: '{}' });
    TOKEN = ''; sessionStorage.removeItem('carremote_admin_token'); renderLogin();
  };
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => {
      TAB = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
      renderPanel();
    };
  });
  api('/api/me').then(r => { if (r && r.upstream) $('#upstreamBadge').textContent = '后端 ' + r.upstream.replace(/^https?:\/\//, '').slice(0, 28); });
  renderPanel();
}

function renderPanel() {
  if (TAB === 'notice') return renderNotice();
  if (TAB === 'users') return renderUsers();
  if (TAB === 'cards') return renderCards();
  return renderAbout();
}

/* ---------- 公告 ---------- */
async function renderNotice() {
  $('#panel').innerHTML = `
    <div class="card">
      <h2>发布系统公告</h2>
      <p class="hint">发布后，App 每次启动会拉取一次；只有公告 id 变化时才会弹窗，不会重复打扰用户。公告也会出现在「我的 → 系统公告」里。</p>
      <div class="field"><label>标题</label><input id="nTitle" placeholder="例如：新版空调维护通知"></div>
      <div class="field"><label>正文</label><textarea id="nBody" placeholder="支持多行文本"></textarea></div>
      <div class="field" style="max-width:220px"><label>类型</label>
        <select id="nLevel"><option value="info">普通公告</option><option value="warning">重要提醒（橙色）</option></select>
      </div>
      <div class="row">
        <button class="primary" id="btnPublish">发布公告</button>
        <span class="msg" id="noticeMsg"></span>
      </div>
    </div>
    <div class="card"><h2>历史公告</h2><p class="hint">最新一条即为 App 当前展示的公告。</p><div id="noticeList">加载中…</div></div>`;
  $('#btnPublish').onclick = async () => {
    const title = $('#nTitle').value.trim(), body = $('#nBody').value.trim();
    if (!title || !body) { setMsg('noticeMsg', '请填写标题和正文', false); return; }
    const r = await api('/api/notice', { method: 'POST', body: JSON.stringify({ title, body, level: $('#nLevel').value }) });
    if (r.ok) {
      setMsg('noticeMsg', '已发布，App 下次启动即可看到', true);
      $('#nTitle').value = ''; $('#nBody').value = '';
      loadNotices();
    } else setMsg('noticeMsg', r.message || '发布失败', false);
  };
  loadNotices();
}

async function loadNotices() {
  const r = await api('/api/notices');
  const box = $('#noticeList'); if (!box) return;
  if (!r.items || !r.items.length) { box.innerHTML = '<p class="hint">还没有发布过公告。</p>'; return; }
  box.innerHTML = r.items.map(n => `
    <div class="notice-item">
      <div class="t">${esc(n.title)} ${n.level === 'warning' ? '⚠️' : ''}</div>
      <div class="d">${esc(n.date)} · ${esc(n.id)}</div>
      <div class="b">${esc(n.body)}</div>
    </div>`).join('');
}

/* ---------- 用户与限制 ---------- */
function creds(extra) {
  return Object.assign({ password: $('#admPwd').value.trim(), caller: $('#admCaller').value.trim() }, extra || {});
}
function credsReady() {
  if (!$('#admPwd').value.trim() || !$('#admCaller').value.trim()) {
    setMsg('userMsg', '请先填写「站主手机号」和「网页版管理密码」', false); return false;
  }
  return true;
}
async function callUpstream(path, payload, msgId, okText) {
  setMsg(msgId, '处理中…', true);
  try {
    const r = await api('/api/upstream', { method: 'POST', body: JSON.stringify({ path, payload }) });
    return r;
  } catch (e) {
    setMsg(msgId, '请求失败：' + e.message, false);
    return { data: { message: e.message } };
  }
}

function renderUsers() {
  $('#panel').innerHTML = `
    <div class="card">
      <h2>连接网页版权限</h2>
      <p class="hint">下面两项与 App 内「白名单管理」用的是同一套 /admin 接口和密码。这里做的限制会立刻作用于 App（App 回前台复查授权）。</p>
      <div class="grid2">
        <div class="field"><label>站主手机号（caller）</label><input id="admCaller" placeholder="18595464954"></div>
        <div class="field"><label>网页版管理密码（password）</label><input id="admPwd" type="password" placeholder="网页版 /admin 的管理密码"></div>
      </div>
      <div class="row">
        <button class="primary" id="btnUsage">查询使用统计</button>
        <span class="msg" id="userMsg"></span>
      </div>
      <div id="usageBox" style="margin-top:16px"></div>
    </div>
    <div class="card">
      <h2>限制 / 解除 / 强制下线</h2>
      <p class="hint">输入目标手机号后点操作。开启「白名单模式」并把某人移出白名单，即可限制其使用；网页与 App 双向联动。</p>
      <div class="field" style="max-width:320px"><label>目标手机号</label><input id="targetPhone" placeholder="要操作的手机号"></div>
      <div class="row">
        <button id="btnUnblock">解除限制</button>
        <button id="btnDelete">删除记录</button>
        <button id="btnRevoke">强制下线</button>
      </div>
    </div>
    <div class="card">
      <h2>白名单模式</h2>
      <div class="row" style="margin-bottom:14px">
        <button id="btnWlOn">开启白名单</button>
        <button id="btnWlOff">关闭白名单</button>
      </div>
      <div class="row">
        <input id="wlPhone" class="grow" placeholder="手机号">
        <button id="btnWlAdd">加入白名单</button>
        <button id="btnWlRemove" class="danger">移出白名单</button>
      </div>
      <div class="msg" id="wlMsg"></div>
    </div>`;
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

  bind('btnUsage', async () => {
    if (!credsReady()) return;
    const r = await callUpstream('/admin/usage', creds(), 'userMsg');
    const data = r.data || {};
    if (r.status !== 200 || data.success === false) {
      setMsg('userMsg', data.message || ('后端返回 HTTP ' + r.status), false);
      $('#usageBox').innerHTML = '<pre>' + esc(JSON.stringify(data, null, 2)) + '</pre>';
      return;
    }
    setMsg('userMsg', '已获取 ' + ((data.items || []).length) + ' 条记录', true);
    const items = data.items || [];
    $('#usageBox').innerHTML = items.length ? `
      <table><thead><tr><th>手机号</th><th>状态</th><th>最近使用</th><th>操作</th></tr></thead><tbody>
      ${items.map(it => `<tr>
        <td>${esc(it.phone)}</td>
        <td>${it.blocked ? '<span style="color:#fca5a5">已限制</span>' : '<span style="color:#4ade80">正常</span>'}</td>
        <td>${esc(it.last_seen || it.lastSeen || it.time || '-')}</td>
        <td><button class="mini" data-unblock="${esc(it.phone)}">解除</button><button class="mini" data-revoke="${esc(it.phone)}">下线</button></td>
      </tr>`).join('')}
      </tbody></table>` : '<p class="hint">暂无使用记录。</p>';
    document.querySelectorAll('[data-unblock]').forEach(b => b.onclick = () => doTarget('/admin/usage/unblock', b.dataset.unblock, 'phone'));
    document.querySelectorAll('[data-revoke]').forEach(b => b.onclick = () => doTarget('/api/auth/revoke', b.dataset.revoke, 'target'));
  });

  async function doTarget(path, phone, key) {
    if (!credsReady()) return;
    const payload = key === 'target'
      ? { caller: $('#admCaller').value.trim(), target: phone }
      : creds({ [key]: phone });
    const r = await callUpstream(path, payload, 'userMsg');
    const ok = r.status === 200 && (r.data || {}).success !== false;
    setMsg('userMsg', ok ? '操作完成：' + phone : ((r.data || {}).message || '操作失败'), ok);
  }

  bind('btnUnblock', () => { const p = $('#targetPhone').value.trim(); if (p) doTarget('/admin/usage/unblock', p, 'phone'); });
  bind('btnDelete', () => { const p = $('#targetPhone').value.trim(); if (p) doTarget('/admin/usage/delete', p, 'phone'); });
  bind('btnRevoke', () => { const p = $('#targetPhone').value.trim(); if (p) doTarget('/api/auth/revoke', p, 'target'); });

  async function wl(path, extra, msgId) {
    if (!credsReady()) return;
    const r = await callUpstream(path, creds(extra), msgId);
    const ok = r.status === 200 && (r.data || {}).success !== false;
    setMsg(msgId, ok ? '白名单操作完成' : ((r.data || {}).message || '操作失败'), ok);
  }
  bind('btnWlOn', () => wl('/admin/wl/toggle', { enable: true }, 'wlMsg'));
  bind('btnWlOff', () => wl('/admin/wl/toggle', { enable: false }, 'wlMsg'));
  bind('btnWlAdd', () => { const p = $('#wlPhone').value.trim(); if (p) wl('/admin/wl/add', { phone: p }, 'wlMsg'); });
  bind('btnWlRemove', () => { const p = $('#wlPhone').value.trim(); if (p) wl('/admin/wl/remove', { phone: p }, 'wlMsg'); });
}

/* ---------- 卡密 ---------- */
function renderCards() {
  $('#panel').innerHTML = `
    <div class="card">
      <h2>卡密管理</h2>
      <p class="hint">与 App 内「白名单管理 → 卡密」完全同源，生成后用户可在 App 体验网关兑换。</p>
      <div class="grid2">
        <div class="field"><label>站主手机号（caller）</label><input id="admCaller" placeholder="18595464954"></div>
        <div class="field"><label>网页版管理密码</label><input id="admPwd" type="password"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>生成数量</label><input id="cardCount" type="number" value="1" min="1" max="50"></div>
        <div class="field"><label>备注</label><input id="cardNote" placeholder="备注（可选）"></div>
      </div>
      <div class="row">
        <button class="primary" id="btnGen">生成卡密</button>
        <button id="btnList">刷新列表</button>
        <span class="msg" id="cardMsg"></span>
      </div>
      <div id="cardBox" style="margin-top:16px"></div>
    </div>`;
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  bind('btnGen', async () => {
    if (!credsReady()) return;
    const r = await callUpstream('/admin/card/generate', creds({
      count: Number($('#cardCount').value || 1), note: $('#cardNote').value.trim(), expireDate: ''
    }), 'cardMsg');
    const d = r.data || {};
    setMsg('cardMsg', d.success === false ? (d.message || '生成失败') : '生成完成', d.success !== false);
    $('#cardBox').innerHTML = '<pre>' + esc(JSON.stringify(d, null, 2)) + '</pre>';
  });
  bind('btnList', async () => {
    if (!credsReady()) return;
    const r = await callUpstream('/admin/card/list', creds(), 'cardMsg');
    $('#cardBox').innerHTML = '<pre>' + esc(JSON.stringify(r.data || {}, null, 2)) + '</pre>';
  });
}

/* ---------- 说明 ---------- */
function renderAbout() {
  $('#panel').innerHTML = `
    <div class="card">
      <h2>接入步骤</h2>
      <p class="hint">
        1. 在本机 / NAS / 云主机运行 <code>node server.js</code>（或 <code>./start.sh</code>），默认端口 8787。<br>
        2. 用浏览器打开后台地址，输入后台密码登录（默认 admin888，建议用 <code>ADMIN_PASSWORD</code> 环境变量修改）。<br>
        3. 在 App 里打开「我的 → 网站后台」，把后台地址填进去（例如 <code>http://192.168.1.10:8787</code> 或你的域名）。<br>
        4. 之后在这里发布公告、限制用户，App 都会同步生效。
      </p>
      <h2>双向联动怎么实现的</h2>
      <p class="hint">
        网页后台的「用户与限制 / 白名单 / 卡密」通过服务端反向代理调用网页版 <code>/admin/*</code> 接口；
        App 内的「白名单管理」调用的是同一套接口，且 App 每次回前台都会复查授权（recheckAccess）。
        所以在网页里限制某人，软件里也用不了；在软件里封禁，网页后台同样查得到。
      </p>
      <h2>安全提示</h2>
      <p class="hint">
        这个后台只面向你一个人，请务必修改默认密码；如需公网访问，建议套一层 HTTPS 反向代理，
        并限制来源 IP。公告接口 <code>GET /api/notice</code> 是公开的（App 需要读），其余接口都需要登录 token。
      </p>
      <h2>常用环境变量</h2>
      <pre>PORT=8787
ADMIN_PASSWORD=你的后台密码
UPSTREAM=https://a9db267525c1cf6b2.app.workbuddy.host</pre>
    </div>`;
}

/* ---------- 启动 ---------- */
(async () => {
  if (!TOKEN) { renderLogin(); return; }
  const me = await api('/api/me');
  if (me && me.ok) renderMain();
  else { TOKEN = ''; sessionStorage.removeItem('carremote_admin_token'); renderLogin(); }
})();
</script>
</body>
</html>
