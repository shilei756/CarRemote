# =============================================================
# CAKOCHE 云端构建流水线（独立于正式版 build-ipa.yml）
#
# 只在需要出 CAKOCHE 包时运行：手动触发，或 push 改到 CAKOCHE/ 相关文件。
# 走未签名 archive → 直接打包 Payload，巨魔 / 全能签用户可直接安装，
# 无需新增 App ID 描述文件。
# =============================================================
name: Build CAKOCHE IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "CAKOCHE/**"
      - "CarRemote/**"
      - "CarCore/**"
      - "project.yml"
      - "project.cakoche.yml"
      - "CarRemote/Resources/3DModel/Gallery/**"
      - ".github/workflows/build-cakoche.yml"

concurrency:
  group: build-cakoche-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并导出 CAKOCHE IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成含 CAKOCHE 目标的 Xcode 工程
        run: |
          set -euo pipefail
          # 用独立 root spec 合并正式版工程 + CAKOCHE 目标，正式版 project.yml 不改一字。
          # 显式关掉小组件，首版 CAKOCHE 不带 appex（避免扩展描述文件交叉引用）。
          INCLUDE_WIDGET=false xcodegen -s project.cakoche.root.yml
          echo "=== 工程内 CAKOCHE 目标 ==="
          grep -c "CAKOCHE" CarRemote.xcodeproj/project.pbxproj || true

      - name: Archive 编译（未签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project CarRemote.xcodeproj \
            -scheme CAKOCHE \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CAKOCHE.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包 IPA
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION' project.cakoche.yml | sed 's/.*"\(.*\)".*/\1/' || true)
          [ -n "${VERSION}" ] || VERSION="1.0.0"
          STAMP=$(date -u +%Y%m%d-%H%M)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IPA_NAME="CAKOCHE-${VERSION}-b${GITHUB_RUN_NUMBER}-${STAMP}-${SHORT_SHA}.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          echo "产物文件名：${IPA_NAME}"
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/CAKOCHE.xcarchive/Products/Applications"
          mkdir -p Payload
          cp -R CAKOCHE.app Payload/
          zip -qry "$RUNNER_TEMP/ipa/${IPA_NAME}" Payload
          ls -lh "$RUNNER_TEMP/ipa"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: CAKOCHE-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
